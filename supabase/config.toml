# Supabase CLI configuration for the local stack (`supabase start`).
# The same schema/migrations serve four hosted projects:
#   iwant-usa-staging, iwant-usa-prod, iwant-india-staging, iwant-india-prod (ap-south-1)
# Hosted projects take their Auth settings from the dashboard / Management API,
# not from this file; see supabase/README.md. Secrets are read with env(...)
# from supabase/.env (copy supabase/.env.example).

project_id = "iwant"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
# Default local seed = India + demo data. For USA run:
#   supabase db reset --no-seed && psql "$DB_URL" -f supabase/seed.sql -f supabase/seed/usa.sql \
#     -f supabase/seed/demo_generator.sql -f supabase/seed/usa_demo.sql
# (or swap india -> usa below). See README "Per-country seeds".
sql_paths = ["./seed.sql", "./seed/india.sql", "./seed/demo_generator.sql", "./seed/india_demo.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "https://127.0.0.1:3000",
  "com.calecute.iwant.usa://login-callback",
  "com.calecute.iwant.india://login-callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = true
minimum_password_length = 8

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

# Bot protection on sign-up / OTP send (Section 20.5). The Flutter web build and
# the admin panel render the Turnstile widget and pass captchaToken; the mobile
# apps use Firebase App Check on Edge Functions instead. Leave disabled locally
# unless you test the widget.
[auth.captcha]
enabled = false
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

# Custom claims: roles, active_mode, account_status, seller_verified.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your I Want code is {{ .Code }}. Do not share it."
max_frequency = "30s"

# Test OTPs (Section 20.2 / 23.4): local stack only. Clearly fictional numbers,
# the same code in both apps. On hosted projects configure these in the
# dashboard (Auth > Providers > Phone > "Test phone numbers") and keep them
# DISABLED in production except the store-review demo accounts
# (USA 15555550104/15555550105, India 910000000005/910000000006).
[auth.sms.test_otp]
# USA (+1 555-01xx)
15555550100 = "123456" # buyer
15555550101 = "123456" # seller
15555550102 = "123456" # verified seller
15555550103 = "123456" # admin
15555550104 = "123456" # store-review buyer (App Review / Play review)
15555550105 = "123456" # store-review seller
# India (+91 0...)
910000000001 = "123456" # buyer
910000000002 = "123456" # seller
910000000003 = "123456" # verified seller
910000000004 = "123456" # admin
910000000005 = "123456" # store-review buyer
910000000006 = "123456" # store-review seller

# Real SMS: Twilio Verify (USA) / Twilio or a Send SMS hook to MSG91 (India,
# DLT-registered template). Disabled locally: test_otp numbers above work
# without a provider.
[auth.sms.twilio_verify]
enabled = false
account_sid = "env(SUPABASE_AUTH_SMS_TWILIO_ACCOUNT_SID)"
message_service_sid = "env(SUPABASE_AUTH_SMS_TWILIO_VERIFY_SERVICE_SID)"
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Google: web client id first, then the Android/iOS client ids (comma separated)
# so native id-token sign-in (google_sign_in -> signInWithIdToken) is accepted.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""
# Native iOS Google sign-in does not let us pass a hashed nonce.
skip_nonce_check = true

# Apple: client_id lists the Services ID (web) and both bundle ids
# (com.calecute.iwant.usa,com.calecute.iwant.india) for native sign-in.
# secret = the generated ES256 client secret JWT (rotate every <= 6 months).
[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"
redirect_uri = ""

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[edge_runtime.secrets]
# Local values come from supabase/functions/.env (see supabase/.env.example).

# Functions called by the database (pg_net), cron, payment stores or email
# providers verify their own secret / signature instead of a user JWT.
[functions.match-request]
verify_jwt = false

[functions.send-push]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.razorpay-webhook]
verify_jwt = false

[functions.play-rtdn]
verify_jwt = false

[functions.appstore-notifications]
verify_jwt = false

[functions.outreach-send]
verify_jwt = false

[functions.outreach-webhook]
verify_jwt = false

# Website forms (web/): Turnstile + honeypot + per-IP rate limit, CORS allow-list.
[functions.web-forms]
verify_jwt = false

# import-leads runs from the admin panel (admin JWT) and from pg_cron
# (x-webhook-secret), so it checks both itself.
[functions.import-leads]
verify_jwt = false

# User-facing functions keep the gateway JWT check.
[functions.delete-account]
verify_jwt = true

[functions.create-checkout]
verify_jwt = true

[functions.brochure-link]
verify_jwt = true

[analytics]
enabled = false
