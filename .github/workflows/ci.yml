# Analyze, test and build both country apps on every push and pull request (brief Section 14).
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  detect:
    # hashFiles() is not allowed in job-level `if`, so detect optional parts here.
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.d.outputs.admin }}
      web: ${{ steps.d.outputs.web }}
      supabase: ${{ steps.d.outputs.supabase }}
    steps:
      - uses: actions/checkout@v5
      - id: d
        run: |
          echo "admin=$([ -f admin/pubspec.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ -f web/app_site/package.json ] && [ -f web/trends_site/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "supabase=$([ -f supabase/config.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  flutter:
    name: Analyze and test (app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          dart format lib >/dev/null   # normalise generated code to the repo's page width
          git diff --exit-code -- lib
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - name: Tests (both countries are covered by the test suite)
        run: flutter test --coverage

  android:
    name: Android AAB (${{ matrix.flavor }})
    needs: flutter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: usaProd, country: usa }
          - { flavor: indiaProd, country: india }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # No keystore on PRs: the build falls back to debug signing. Store uploads happen in release.yml.
      - name: Build release AAB
        run: >
          flutter build appbundle --release
          --flavor ${{ matrix.flavor }} -t lib/main_${{ matrix.country }}.dart
          --dart-define-from-file=config/${{ matrix.country }}.prod.json
      - uses: actions/upload-artifact@v5
        with:
          name: aab-${{ matrix.flavor }}
          path: build/app/outputs/bundle/${{ matrix.flavor }}Release/*.aab
          retention-days: 7

  admin:
    name: Admin panel
    needs: detect
    if: needs.detect.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define-from-file=../config/usa.prod.json

  database:
    name: Database (pgTAP), Edge Functions (deno test) and app integration test
    needs: detect
    if: needs.detect.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0 # pinned: "latest" calls the GitHub API and can hit its rate limit
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Start local Supabase (migrations + seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: pgTAP
        run: supabase test db supabase/tests/database
      - name: Edge Function tests
        working-directory: supabase/functions
        run: deno test --allow-env --allow-net --allow-read
      # Happy path (buyer posts, seller quotes, buyer accepts) through the app's
      # Supabase repositories against this stack: test/integration/happy_path_test.dart.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Local API URL and anon key
        run: |
          # The CLI prints API_URL and ANON_KEY (among others) as KEY="value" lines.
          eval "$(supabase status -o env)"
          test -n "${API_URL:-}" && test -n "${ANON_KEY:-}"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Integration test (India seed, the config.toml default)
        run: flutter test test/integration
        env:
          COUNTRY: india
      - name: Reseed the stack for the USA
        run: |
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          supabase db reset --no-seed
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q \
            -f supabase/seed.sql -f supabase/seed/usa.sql \
            -f supabase/seed/demo_generator.sql -f supabase/seed/usa_demo.sql
      - name: Integration test (USA seed)
        run: flutter test test/integration
        env:
          COUNTRY: usa
      - if: always()
        run: supabase stop --no-backup

  websites:
    name: Website builds (${{ matrix.site }}, ${{ matrix.country }})
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [app_site, trends_site]
        country: [usa, india]
    defaults:
      run:
        working-directory: web/${{ matrix.site }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm run build
        env:
          SITE_COUNTRY: ${{ matrix.country }}
      - name: Check OG images and hreflang
        run: npm run check:dist
      # Sample data so the checks below cover price, guide and seller pages
      # (app_site) and articles (trends_site). trends_site ignores SITE_COUNTRY,
      # so it runs these once.
      - name: Build with fixtures
        if: matrix.site == 'app_site' || matrix.country == 'usa'
        run: |
          if [ "$SITE" = app_site ]; then
            SEO_DATA_FILE="data/seo/fixtures/$SITE_COUNTRY.json" npm run build
          else
            BUILD_NOW=2026-10-02T00:00:00Z npm run build:fixtures
          fi
          npm run check:dist
        env:
          SITE: ${{ matrix.site }}
          SITE_COUNTRY: ${{ matrix.country }}
      # Core Web Vitals and Lighthouse scores (performance >= 0.9, accessibility
      # >= 0.95, SEO >= 0.95, best practices >= 0.9); pages and thresholds in
      # each site's lighthouserc.cjs. Uses the runner's preinstalled Chrome.
      - name: Lighthouse CI
        if: matrix.site == 'app_site' || matrix.country == 'usa'
        run: npm run lhci
        env:
          SITE_COUNTRY: ${{ matrix.country }}
      - uses: actions/upload-artifact@v5
        if: always() && (matrix.site == 'app_site' || matrix.country == 'usa')
        with:
          name: lighthouse-${{ matrix.site }}-${{ matrix.country }}
          path: web/${{ matrix.site }}/.lighthouseci/reports
          if-no-files-found: ignore
          retention-days: 14
