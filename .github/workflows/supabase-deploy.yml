# Database migrations and Edge Functions (brief Section 14):
#   push to main -> staging projects (USA and India)
#   tag v*       -> production projects (needs the "production-*" GitHub environments' approval)
# pgTAP and Deno tests must pass first.
name: Supabase deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "staging or production"
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: supabase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
      - working-directory: supabase/functions
        run: deno test --allow-env --allow-net --allow-read
      - if: always()
        run: supabase stop --no-backup

  deploy:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        country: [usa, india]
    # GitHub environments: staging-usa, staging-india, production-usa, production-india.
    # Each holds SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD; production ones require a reviewer.
    environment: >-
      ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.target == 'production') && 'production' || 'staging' }}-${{ matrix.country }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Skip when the project is not linked yet
        id: gate
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Supabase project for this environment is not configured yet; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.gate.outputs.skip != 'true'
        run: supabase link --project-ref "$PROJECT_REF"
      - if: steps.gate.outputs.skip != 'true'
        name: Migrations
        run: supabase db push --include-all
      - if: steps.gate.outputs.skip != 'true'
        name: Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
